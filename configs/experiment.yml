  name: "meta-llama/Meta-Llama-3-8B"
  kv_cache_dtype: "int4"
  quant_granularity: "per_channel"

dataset:
  path: "data/eval_long_context.jsonl"
  max_seq_len: 16384

generation:
  temperature: 0.0
